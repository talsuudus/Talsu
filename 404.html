<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Page Not Found — TALSUUDUS</title>
<meta name="description" content="The page you're looking for doesn't exist on the TALSUUDUS platform.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141715;
    --purple-1:#22a366;
    --purple-2:#1a7a4c;
    --glass-bg: rgba(255,255,255,0.4);
    --glass-border: rgba(255,255,255,0.75);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Barlow', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:linear-gradient(180deg, #ffffff 0%, #f5faf7 55%, #eaf5ef 100%);
    text-align:center;
  }
  .card{
    max-width:420px;
    width:100%;
    padding:44px 30px 36px;
    border-radius:28px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:0 20px 50px rgba(10,40,25,0.22), inset 0 1px 1px rgba(255,255,255,0.9);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
  }
  .mark{
    width:64px; height:64px; margin:0 auto 22px;
    border-radius:18px;
    background:linear-gradient(135deg, var(--purple-1), var(--purple-2));
    box-shadow:0 10px 24px rgba(90,60,200,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .mark svg{ width:30px; height:30px; }
  .code{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:900;
    font-size:clamp(56px, 18vw, 84px);
    line-height:0.9;
    letter-spacing:-0.02em;
    background:linear-gradient(135deg, var(--ink) 15%, var(--purple-1) 60%, var(--purple-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0 0 6px;
  }
  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800; font-size:22px; margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  p{
    margin:0 0 26px;
    font-size:14.5px; line-height:1.6;
    color:rgba(20,23,21,0.72);
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 26px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--purple-1), var(--purple-2));
    color:#fff; text-decoration:none;
    font-weight:700; font-size:14.5px;
    box-shadow:0 10px 24px rgba(26,122,76,0.35);
    transition:transform 180ms ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn svg{ width:16px; height:16px; }
  .links{ margin-top:22px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .links a{
    font-size:12.5px; font-weight:600; color:rgba(20,23,21,0.6);
    text-decoration:none; border-bottom:1px solid rgba(26,122,76,0.35);
    padding-bottom:1px;
  }
  .links a:hover{ color:var(--purple-2); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>
    </div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist, may have moved, or the link is outdated.</p>
    <a class="btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Back to Home
    </a>
    <div class="links">
      <a href="members.html">Members</a>
      <a href="constitution.html">Constitution</a>
      <a href="studyvault.html">Study Vault</a>
    </div>
  </div>
</body>
</html>
