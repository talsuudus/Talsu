<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Announcements — TALSUUDUS</title>
<meta name="description" content="TALSUUDUS Announcements page is currently under development.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141715;
    --purple-1:#22a366;
    --purple-2:#1a7a4c;
    --glass-bg: rgba(255,255,255,0.4);
    --glass-border: rgba(255,255,255,0.75);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Barlow', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:linear-gradient(180deg, #ffffff 0%, #f5faf7 55%, #eaf5ef 100%);
    text-align:center;
  }
  .card{
    max-width:420px;
    width:100%;
    padding:44px 30px 36px;
    border-radius:28px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:0 20px 50px rgba(10,40,25,0.22), inset 0 1px 1px rgba(255,255,255,0.9);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
  }
  .mark{
    width:64px; height:64px; margin:0 auto 22px;
    border-radius:18px;
    background:linear-gradient(135deg, var(--purple-1), var(--purple-2));
    box-shadow:0 10px 24px rgba(90,60,200,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .mark svg{ width:28px; height:28px; }
  .eyebrow{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
    color:#1a7a4c; background:rgba(26,122,76,0.12);
    border:1px solid rgba(26,122,76,0.3);
    padding:5px 14px; border-radius:40px;
    margin-bottom:18px;
  }
  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800; font-size:26px; margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  p{
    margin:0 0 26px;
    font-size:14.5px; line-height:1.6;
    color:rgba(20,23,21,0.75);
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 26px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--purple-1), var(--purple-2));
    color:#fff; text-decoration:none;
    font-weight:700; font-size:14.5px;
    box-shadow:0 10px 24px rgba(26,122,76,0.35);
    transition:transform 180ms ease;
    border:none; cursor:pointer;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn svg{ width:16px; height:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    </div>
    <span class="eyebrow">Coming Soon</span>
    <h1>Announcements is under development</h1>
    <p>We're building a proper space for TALSUUDUS news and updates. It isn't ready yet — check back soon.</p>
    <button class="btn" onclick="if(document.referrer && document.referrer.indexOf(window.location.host) !== -1){history.back()}else{location.href='index.html'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Go Back
    </button>
  </div>
</body>
</html>
